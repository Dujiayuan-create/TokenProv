name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m tokenprov.server_eval smoke --config configs/smoke.yaml

  proof-worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: node --check tools/zk/proof_worker.mjs
      - run: node --check tools/zk/c_assurance_worker.mjs
